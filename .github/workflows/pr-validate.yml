name: pr-validate

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  cloudbuild-pr-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Guard required secrets
        id: guard
        shell: bash
        run: |
          if [[ -z "${{ secrets.GCP_WIF_PROVIDER }}" || -z "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" || -z "${{ secrets.GCP_PROJECT_ID }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Required GCP secrets are missing. Skip cloudbuild-pr-validate."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        if: steps.guard.outputs.skip != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        if: steps.guard.outputs.skip != 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Cloud Build (build only)
        if: steps.guard.outputs.skip != 'true'
        run: |
          gcloud beta builds submit --config=cloudbuild.pr.yaml .
